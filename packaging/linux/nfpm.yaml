# Desktop app package. scripts/build-packages.sh renders the @PLACEHOLDERS@
# and stages the payload: the published AppImage, unpacked into @INSTALL_DIR@.
name: "@NAME@"
version: ${PKG_VERSION}
arch: ${PKG_ARCH}
platform: linux
section: devel
priority: optional
maintainer: T3 Tools <hello@t3.codes>
vendor: T3 Tools
homepage: https://t3.codes
license: MIT
description: |-
  Desktop GUI for coding agents
  T3 Code runs Codex, Claude, Cursor, Grok Build, OpenCode, and Antigravity
  agents on this machine and on remote T3 Code servers.

# Stable and nightly share the t3code:// URL handler and the user data
# directory, so only one can be installed at a time.
conflicts:
  - "@CONFLICTS@"
replaces:
  - "@CONFLICTS@"

contents:
  - src: ./root/opt/
    dst: /opt/
    type: tree
  - src: ./root/usr/
    dst: /usr/
    type: tree
  - src: "@INSTALL_DIR@/t3code"
    dst: /usr/bin/@NAME@
    type: symlink
  - src: ./package-type.@FORMAT@
    dst: "@INSTALL_DIR@/resources/package-type"
  # Repository definitions are config files, so a user's edits survive
  # upgrades and removing the package leaves no stale source behind.
  - src: ./repo/t3code-@CHANNEL@.sources
    dst: /etc/apt/sources.list.d/t3code-@CHANNEL@.sources
    type: config|noreplace
    packager: deb
  - src: ./repo/t3code-archive-keyring.gpg
    dst: /usr/share/keyrings/t3code-archive-keyring.gpg
    packager: deb
  - src: ./repo/t3code-@CHANNEL@.repo
    dst: /etc/yum.repos.d/t3code-@CHANNEL@.repo
    type: config|noreplace
    packager: rpm
  - src: ./repo/t3code-archive-keyring.asc
    dst: /etc/pki/rpm-gpg/RPM-GPG-KEY-t3code
    packager: rpm

overrides:
  deb:
    depends:
      - libasound2t64 | libasound2
      - libatk-bridge2.0-0t64 | libatk-bridge2.0-0
      - libatspi2.0-0t64 | libatspi2.0-0
      - libcups2t64 | libcups2
      - libgbm1
      - libgtk-3-0t64 | libgtk-3-0
      - libnotify4
      - libnss3
      - libsecret-1-0
      - libxss1
      - libxtst6
      - xdg-utils
    recommends:
      - git
  rpm:
    depends:
      - alsa-lib
      - at-spi2-atk
      - at-spi2-core
      - cups-libs
      - gtk3
      - libnotify
      - libsecret
      - libXScrnSaver
      - libXtst
      - mesa-libgbm
      - nss
      - xdg-utils
    recommends:
      - git

deb:
  fields:
    Bugs: https://github.com/pingdotgg/t3code/issues

rpm:
  group: Development/Tools
  summary: Desktop GUI for coding agents
  compression: zstd
  signature:
    key_file: ${RPM_SIGNING_KEY_FILE}
