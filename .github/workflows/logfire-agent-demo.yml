name: Logfire agent demo

on:
  push:
    branches: [demo/logfire-orchestrator-do-not-merge]
    paths:
      - "examples/logfire-agent/**"
      - ".github/workflows/logfire-agent-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: examples/logfire-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: examples/logfire-agent/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
